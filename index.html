<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسابقة المعرفة الإسلامية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #1a6b4a; --primary-light: #2d9d6f; --primary-dark: #0e4a32;
            --gold: #d4a843; --gold-light: #f0d078;
            --bg: #0a1628; --bg-card: #112240; --bg-card-hover: #1a3358;
            --text: #e6f1ff; --text-dim: #8892b0;
            --correct: #2ecc71; --wrong: #e74c3c; --radius: 16px;
        }
        body { font-family:'Tajawal',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
        .bg-pattern {
            position:fixed;top:0;left:0;width:100%;height:100%;
            background-image:radial-gradient(circle at 20% 50%,rgba(26,107,74,0.08) 0%,transparent 50%),radial-gradient(circle at 80% 20%,rgba(212,168,67,0.06) 0%,transparent 50%),radial-gradient(circle at 50% 80%,rgba(26,107,74,0.05) 0%,transparent 50%);
            pointer-events:none;z-index:0;
        }
        .geometric-decoration { position:fixed;width:300px;height:300px;border:1px solid rgba(212,168,67,0.08);border-radius:50%;pointer-events:none;z-index:0; }
        .geometric-decoration:nth-child(1){top:-100px;right:-100px}
        .geometric-decoration:nth-child(2){bottom:-150px;left:-100px;width:400px;height:400px}
        .container { position:relative;z-index:1;max-width:900px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center; }
        .screen{display:none;width:100%;animation:fadeIn 0.5s ease} .screen.active{display:block}
        @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
        @keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
        @keyframes correctFlash{0%{background:var(--correct);box-shadow:0 0 30px rgba(46,204,113,0.5)}100%{background:rgba(46,204,113,0.15)}}
        @keyframes wrongShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
        @keyframes timerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15);color:var(--wrong)}}
        @keyframes confetti{0%{transform:translateY(-100vh) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
        @keyframes levelUp{0%{transform:scale(0.5);opacity:0}50%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}

        .logo{text-align:center;margin-bottom:40px}
        .logo-icon{font-size:80px;margin-bottom:10px;display:block}
        .logo h1{font-size:2.8rem;font-weight:900;background:linear-gradient(135deg,var(--gold-light),var(--gold),var(--primary-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
        .logo p{color:var(--text-dim);font-size:1.1rem}
        .players-setup{background:var(--bg-card);border-radius:var(--radius);padding:30px;border:1px solid rgba(212,168,67,0.15)}
        .players-setup h2{font-size:1.3rem;color:var(--gold);margin-bottom:20px;display:flex;align-items:center;gap:10px}
        .player-count{display:flex;gap:10px;margin-bottom:25px;justify-content:center}
        .count-btn{width:55px;height:55px;border-radius:12px;border:2px solid rgba(212,168,67,0.3);background:transparent;color:var(--text);font-size:1.3rem;font-family:'Tajawal';font-weight:700;cursor:pointer;transition:all 0.3s}
        .count-btn:hover{border-color:var(--gold);background:rgba(212,168,67,0.1)}
        .count-btn.active{background:var(--gold);color:var(--bg);border-color:var(--gold)}
        .player-inputs{display:flex;flex-direction:column;gap:12px;margin-bottom:25px}
        .player-input-row{display:flex;align-items:center;gap:12px;animation:slideIn 0.3s ease}
        .player-avatar{width:45px;height:45px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:800;flex-shrink:0}
        .player-input-row:nth-child(1) .player-avatar{background:#2ecc71;color:#fff}
        .player-input-row:nth-child(2) .player-avatar{background:#3498db;color:#fff}
        .player-input-row:nth-child(3) .player-avatar{background:#e67e22;color:#fff}
        .player-input-row:nth-child(4) .player-avatar{background:#9b59b6;color:#fff}
        .player-input-row input{flex:1;padding:12px 16px;border-radius:10px;border:2px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:var(--text);font-size:1rem;font-family:'Tajawal';transition:border-color 0.3s}
        .player-input-row input:focus{outline:none;border-color:var(--gold)}
        .player-input-row input::placeholder{color:var(--text-dim)}
        .settings-row{display:flex;gap:15px;margin-bottom:25px;flex-wrap:wrap}
        .setting-group{flex:1;min-width:200px}
        .setting-group label{display:block;color:var(--text-dim);font-size:0.9rem;margin-bottom:8px}
        .setting-group select{width:100%;padding:10px 14px;border-radius:10px;border:2px solid rgba(255,255,255,0.1);background:var(--bg);color:var(--text);font-size:1rem;font-family:'Tajawal';cursor:pointer}
        .setting-group select:focus{outline:none;border-color:var(--gold)}
        .btn-start{width:100%;padding:16px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;font-size:1.3rem;font-weight:700;font-family:'Tajawal';cursor:pointer;transition:all 0.3s}
        .btn-start:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(26,107,74,0.4)}

        .category-header{text-align:center;margin-bottom:30px}
        .category-header h2{font-size:2rem;color:var(--gold);margin-bottom:5px}
        .category-header p{color:var(--text-dim)}
        .categories-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;margin-bottom:20px}
        .category-card{background:var(--bg-card);border:2px solid rgba(212,168,67,0.15);border-radius:var(--radius);padding:25px;text-align:center;cursor:pointer;transition:all 0.3s}
        .category-card:hover{border-color:var(--gold);background:var(--bg-card-hover);transform:translateY(-3px)}
        .category-card.selected{border-color:var(--gold);background:rgba(212,168,67,0.1)}
        .category-icon{font-size:2.5rem;margin-bottom:10px;display:block}
        .category-card h3{font-size:1.2rem;margin-bottom:5px}
        .category-card p{color:var(--text-dim);font-size:0.85rem}
        .btn-play{width:100%;padding:16px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--bg);font-size:1.3rem;font-weight:700;font-family:'Tajawal';cursor:pointer;transition:all 0.3s}
        .btn-play:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(212,168,67,0.4)}
        .btn-play:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none}

        .level-intro{text-align:center;padding:60px 20px}
        .level-number{font-size:5rem;font-weight:900;background:linear-gradient(135deg,var(--gold-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:levelUp 0.8s ease;display:block}
        .level-title{font-size:1.8rem;margin:10px 0}
        .level-difficulty{display:flex;align-items:center;justify-content:center;gap:8px;margin:15px 0}
        .diff-star{font-size:1.3rem} .diff-star.empty{opacity:0.2}
        .level-desc{color:var(--text-dim);font-size:1.05rem;margin-bottom:10px}
        .level-info-chips{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0}
        .level-chip{background:var(--bg-card);padding:8px 18px;border-radius:20px;font-size:0.9rem;border:1px solid rgba(255,255,255,0.1)}
        .level-chip span{color:var(--gold);font-weight:700}

        .game-top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px}
        .current-player-indicator{display:flex;align-items:center;gap:10px;background:var(--bg-card);padding:8px 18px;border-radius:30px;border:2px solid rgba(212,168,67,0.2)}
        .current-player-dot{width:12px;height:12px;border-radius:50%;animation:pulse 1.5s infinite}
        .current-player-name{font-weight:700;font-size:1.1rem}
        .question-counter{color:var(--text-dim);font-size:0.95rem;background:var(--bg-card);padding:8px 18px;border-radius:30px}
        .timer-display{display:flex;align-items:center;gap:8px;background:var(--bg-card);padding:8px 18px;border-radius:30px;font-size:1.2rem;font-weight:700}
        .timer-display.warning{animation:timerPulse 0.5s infinite;border:2px solid var(--wrong)}

        .level-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;background:var(--bg-card);padding:10px 18px;border-radius:12px;border:1px solid rgba(212,168,67,0.1)}
        .level-badge{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--bg);padding:4px 14px;border-radius:20px;font-weight:800;font-size:0.9rem;white-space:nowrap}
        .level-progress-track{flex:1;height:8px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden}
        .level-progress-fill{height:100%;border-radius:4px;transition:width 0.5s ease;background:linear-gradient(90deg,var(--primary),var(--gold))}
        .level-progress-text{color:var(--text-dim);font-size:0.85rem;min-width:60px;text-align:left}

        .progress-bar-container{width:100%;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;margin-bottom:20px;overflow:hidden}
        .progress-bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--gold));border-radius:3px;transition:width 0.5s ease}

        .question-card{background:var(--bg-card);border-radius:var(--radius);padding:35px;margin-bottom:20px;border:1px solid rgba(212,168,67,0.15);text-align:center}
        .question-category-tag{display:inline-block;padding:4px 14px;border-radius:20px;background:rgba(212,168,67,0.15);color:var(--gold);font-size:0.85rem;margin-bottom:15px}
        .difficulty-tag{display:inline-block;padding:4px 12px;border-radius:20px;font-size:0.8rem;margin-bottom:15px;margin-right:8px}
        .diff-easy{background:rgba(46,204,113,0.15);color:#2ecc71}
        .diff-medium{background:rgba(230,126,34,0.15);color:#e67e22}
        .diff-hard{background:rgba(231,76,60,0.15);color:#e74c3c}
        .diff-expert{background:rgba(155,89,182,0.15);color:#9b59b6}
        .question-text{font-size:1.4rem;font-weight:700;line-height:1.8}

        .options-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        @media(max-width:600px){.options-grid{grid-template-columns:1fr}}
        .option-btn{padding:18px 20px;border-radius:12px;border:2px solid rgba(255,255,255,0.1);background:var(--bg-card);color:var(--text);font-size:1.1rem;font-family:'Tajawal';cursor:pointer;transition:all 0.3s;text-align:center}
        .option-btn:hover:not(.disabled){border-color:var(--gold);background:var(--bg-card-hover)}
        .option-btn.correct{border-color:var(--correct);background:rgba(46,204,113,0.15);animation:correctFlash 0.6s ease}
        .option-btn.wrong{border-color:var(--wrong);background:rgba(231,76,60,0.15);animation:wrongShake 0.4s ease}
        .option-btn.disabled{cursor:not-allowed;opacity:0.6}
        .option-letter{display:inline-block;width:30px;height:30px;line-height:30px;border-radius:8px;background:rgba(255,255,255,0.1);margin-left:10px;font-weight:700;font-size:0.9rem}

        .answer-feedback{text-align:center;margin-top:20px;min-height:60px;display:flex;flex-direction:column;align-items:center;gap:8px}
        .feedback-text{font-size:1.1rem;font-weight:700}
        .feedback-text.correct{color:var(--correct)} .feedback-text.wrong{color:var(--wrong)} .feedback-text.timeout{color:var(--gold)}
        .feedback-detail{color:var(--text-dim);font-size:0.95rem}

        .scores-bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
        .score-chip{display:flex;align-items:center;gap:8px;background:var(--bg-card);padding:8px 14px;border-radius:10px;flex:1;min-width:120px;border:1px solid rgba(255,255,255,0.05)}
        .score-chip-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
        .score-chip-name{font-size:0.85rem;color:var(--text-dim)}
        .score-chip-points{font-weight:700;margin-right:auto;direction:ltr}

        .level-complete-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,22,40,0.92);z-index:50;display:flex;align-items:center;justify-content:center;animation:fadeIn 0.3s ease}
        .level-complete-box{background:var(--bg-card);border-radius:20px;padding:40px;text-align:center;max-width:500px;width:90%;border:2px solid rgba(212,168,67,0.3);animation:levelUp 0.5s ease}
        .level-complete-icon{font-size:60px;display:block;margin-bottom:15px}
        .level-complete-title{font-size:1.6rem;font-weight:800;color:var(--gold);margin-bottom:8px}
        .level-complete-stats{color:var(--text-dim);margin-bottom:20px;line-height:1.8}
        .level-complete-stats strong{color:var(--text)}
        .btn-next-level{padding:14px 40px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;font-size:1.2rem;font-weight:700;font-family:'Tajawal';cursor:pointer;transition:all 0.3s}
        .btn-next-level:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(26,107,74,0.4)}
        .btn-retry-level{padding:14px 40px;border-radius:12px;border:2px solid var(--wrong);background:transparent;color:var(--wrong);font-size:1.1rem;font-weight:700;font-family:'Tajawal';cursor:pointer;transition:all 0.3s;margin-top:10px}
        .btn-retry-level:hover{background:rgba(231,76,60,0.1)}

        .results-container{text-align:center}
        .trophy-icon{font-size:80px;display:block;margin-bottom:10px;animation:pulse 2s infinite}
        .results-title{font-size:2rem;font-weight:900;color:var(--gold);margin-bottom:5px}
        .winner-name{font-size:1.5rem;color:var(--text);margin-bottom:30px}
        .results-table{width:100%;background:var(--bg-card);border-radius:var(--radius);overflow:hidden;margin-bottom:25px;border:1px solid rgba(212,168,67,0.15)}
        .results-row{display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid rgba(255,255,255,0.05);gap:15px}
        .results-row:last-child{border-bottom:none}
        .results-row.first{background:rgba(212,168,67,0.08)}
        .rank-badge{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;flex-shrink:0}
        .rank-1{background:var(--gold);color:var(--bg)} .rank-2{background:#95a5a6;color:var(--bg)} .rank-3{background:#cd7f32;color:var(--bg)} .rank-4{background:rgba(255,255,255,0.1);color:var(--text-dim)}
        .results-player-info{flex:1;text-align:right}
        .results-player-name{font-weight:700;font-size:1.1rem}
        .results-player-stats{color:var(--text-dim);font-size:0.85rem}
        .results-score{font-size:1.5rem;font-weight:800;color:var(--gold)}
        .results-level-reached{color:var(--primary-light);font-size:0.85rem}
        .results-buttons{display:flex;gap:12px}
        .btn-restart{flex:1;padding:14px;border-radius:12px;border:2px solid var(--gold);background:transparent;color:var(--gold);font-size:1.1rem;font-weight:700;font-family:'Tajawal';cursor:pointer;transition:all 0.3s}
        .btn-restart:hover{background:rgba(212,168,67,0.1)}
        .btn-new-game{flex:1;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;font-size:1.1rem;font-weight:700;font-family:'Tajawal';cursor:pointer;transition:all 0.3s}
        .btn-new-game:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(26,107,74,0.4)}
        .confetti-piece{position:fixed;top:-20px;z-index:100;pointer-events:none}

        .mode-selection{display:flex;gap:15px;margin-bottom:25px;flex-wrap:wrap}
        .mode-card{flex:1;min-width:200px;background:var(--bg-card);border:2px solid rgba(212,168,67,0.15);border-radius:var(--radius);padding:30px 20px;text-align:center;cursor:pointer;transition:all 0.3s}
        .mode-card:hover{border-color:var(--gold);background:var(--bg-card-hover);transform:translateY(-3px)}
        .mode-card.selected{border-color:var(--gold);background:rgba(212,168,67,0.1)}
        .mode-card .mode-icon{font-size:3rem;display:block;margin-bottom:10px}
        .mode-card h3{font-size:1.2rem;margin-bottom:5px}
        .mode-card p{color:var(--text-dim);font-size:0.85rem}
        .solo-name-input{margin-bottom:25px}
        .solo-name-input input{width:100%;padding:14px 16px;border-radius:10px;border:2px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:var(--text);font-size:1.1rem;font-family:'Tajawal';text-align:center;transition:border-color 0.3s}
        .solo-name-input input:focus{outline:none;border-color:var(--gold)}
        .solo-name-input input::placeholder{color:var(--text-dim)}
        #multiplayerSection{display:none}
        #soloSection{display:none}

        @media(max-width:600px){
            .logo h1{font-size:2rem} .question-text{font-size:1.15rem} .game-top-bar{justify-content:center}
            .results-buttons{flex-direction:column} .settings-row{flex-direction:column} .level-number{font-size:3.5rem}
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="geometric-decoration"></div>
    <div class="geometric-decoration"></div>
    <div class="container">
        <div class="screen active" id="startScreen">
            <div class="logo">
                <span class="logo-icon">🕌</span>
                <h1>مسابقة المعرفة الإسلامية</h1>
                <p>١٠ مراحل من التحدي في السيرة النبوية والمعلومات الإسلامية</p>
            </div>
            <div class="players-setup">
                <h2>🎮 اختر نوع اللعب</h2>
                <div class="mode-selection">
                    <div class="mode-card" id="modeSolo" onclick="selectMode('solo')">
                        <span class="mode-icon">🧑</span>
                        <h3>لعب فردي</h3>
                        <p>تحدَّ نفسك واختبر معلوماتك</p>
                    </div>
                    <div class="mode-card" id="modeMulti" onclick="selectMode('multi')">
                        <span class="mode-icon">👥</span>
                        <h3>لعب جماعي</h3>
                        <p>تنافس مع ٢-٤ لاعبين</p>
                    </div>
                </div>

                <div id="soloSection">
                    <div class="solo-name-input">
                        <input type="text" placeholder="أدخل اسمك" id="soloName" maxlength="20">
                    </div>
                </div>

                <div id="multiplayerSection">
                    <h2>👥 عدد اللاعبين</h2>
                    <div class="player-count">
                        <button class="count-btn active" data-count="2">٢</button>
                        <button class="count-btn" data-count="3">٣</button>
                        <button class="count-btn" data-count="4">٤</button>
                    </div>
                    <div class="player-inputs" id="playerInputs"></div>
                </div>

                <div class="settings-row" id="settingsRow" style="display:none">
                    <div class="setting-group">
                        <label>وقت السؤال الأساسي</label>
                        <select id="timeLimit">
                            <option value="20">٢٠ ثانية</option>
                            <option value="25" selected>٢٥ ثانية</option>
                            <option value="30">٣٠ ثانية</option>
                            <option value="0">بدون وقت</option>
                        </select>
                    </div>
                </div>
                <button class="btn-start" id="btnStart" onclick="goToCategories()" style="display:none">ابدأ المسابقة ⚡</button>
            </div>
        </div>
        <div class="screen" id="categoryScreen">
            <div class="category-header">
                <h2>اختر التصنيفات</h2>
                <p>اختر تصنيفاً واحداً أو أكثر للمسابقة</p>
            </div>
            <div class="categories-grid" id="categoriesGrid"></div>
            <button class="btn-play" id="btnPlay" disabled onclick="startGame()">ابدأ المراحل 🎮</button>
        </div>
        <div class="screen" id="levelIntroScreen">
            <div class="level-intro" id="levelIntroContent"></div>
        </div>
        <div class="screen" id="gameScreen">
            <div class="game-top-bar">
                <div class="current-player-indicator">
                    <div class="current-player-dot" id="currentPlayerDot"></div>
                    <span class="current-player-name" id="currentPlayerName"></span>
                </div>
                <div class="question-counter" id="questionCounter"></div>
                <div class="timer-display" id="timerDisplay"><span>⏱</span><span id="timerValue"></span></div>
            </div>
            <div class="level-bar">
                <span class="level-badge" id="levelBadge"></span>
                <div class="level-progress-track"><div class="level-progress-fill" id="levelProgressFill"></div></div>
                <span class="level-progress-text" id="levelProgressText"></span>
            </div>
            <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
            <div class="question-card">
                <span class="question-category-tag" id="questionCategory"></span>
                <span class="difficulty-tag" id="difficultyTag"></span>
                <p class="question-text" id="questionText"></p>
            </div>
            <div class="options-grid" id="optionsGrid"></div>

            {q:"ما الفرق بين التوكل والتواكل؟",options:["لا فرق","التوكل: الاعتماد على الله مع الأخذ بالأسباب. التواكل: ترك الأسباب","التواكل أفضل","التوكل ترك العمل"],answer:1},
            {q:"ما هي مراتب القدر الأربع؟",options:["لا توجد مراتب","العلم والكتابة والمشيئة والخلق","الإرادة فقط","العلم فقط"],answer:1},
        ],
        expert: [
            {q:"ما هو تعريف الإيمان عند أهل السنة والجماعة؟",options:["قول باللسان فقط","تصديق بالقلب وقول باللسان وعمل بالجوارح يزيد وينقص","اعتقاد القلب فقط","العمل فقط"],answer:1},
            {q:"ما الفرق بين الإرجاء ومذهب أهل السنة في الإيمان؟",options:["لا فرق","المرجئة أخرجوا العمل من الإيمان وأهل السنة جعلوه ركناً","المرجئة أشد","أهل السنة مرجئة"],answer:1},
            {q:"ما هو مذهب أهل السنة في أفعال العباد؟",options:["الجبر المطلق","أفعال العباد مخلوقة لله وللعبد فيها اختيار وإرادة","العبد يخلق فعله","لا إرادة للعبد"],answer:1},
            {q:"ما هي عقيدة أهل السنة في القرآن؟",options:["مخلوق","كلام الله غير مخلوق منه بدأ وإليه يعود","قديم بذاته","كلام جبريل"],answer:1},
            {q:"ما هو الاستواء على العرش عند أهل السنة؟",options:["استقرار مادي","نثبته كما أخبر الله بلا تكييف ولا تمثيل والكيف مجهول","نؤوله بالاستيلاء","ننفيه"],answer:1},
            {q:"ما هي مسألة خلق القرآن التي امتُحن فيها الإمام أحمد؟",options:["فتنة عادية","قال المعتزلة بخلق القرآن وأبى أحمد وقال إنه كلام الله غير مخلوق وسُجن وعُذب","خلاف بسيط","مسألة فقهية"],answer:1},
            {q:"ما هي عقيدة الوسطية عند أهل السنة بين الفرق؟",options:["التشدد","وسط بين الخوارج والمرجئة في الإيمان، وبين الجبرية والقدرية في القدر، وبين المشبهة والمعطلة في الصفات","التساهل","لا وسطية"],answer:1},
            {q:"ما معنى الولاية في العقيدة الإسلامية (ولي الله)؟",options:["شخص له كرامات خارقة","المؤمن التقي — كل من آمن واتقى فهو ولي لله","شخص معصوم","رجل دين فقط"],answer:1},
            {q:"ما الفرق بين الكرامة والاستدراج؟",options:["لا فرق","الكرامة لأولياء الله الصالحين والاستدراج إمهال الله للعاصي","الكرامة للأنبياء","الاستدراج نوع من الكرامة"],answer:1},
            {q:"ما هي علامات الساعة الكبرى العشر؟ اذكر بعضها",options:["لا توجد علامات كبرى","منها: خروج الدجال ونزول عيسى ويأجوج ومأجوج وطلوع الشمس من مغربها والدخان","الزلازل فقط","الحروب فقط"],answer:1},
            {q:"ما هو مفهوم التكفير عند أهل السنة وضوابطه؟",options:["تكفير كل من أذنب","لا يُكفّر معين إلا بعد إقامة الحجة وانتفاء الموانع (الجهل والتأويل والإكراه)","لا تكفير مطلقاً","تكفير كل المخالفين"],answer:1},
            {q:"ما معنى قاعدة: نُمرّ أحاديث الصفات كما جاءت بلا كيف؟ من قالها؟",options:["الإمام مالك","قالها جمع من السلف ومنهم الإمام أحمد — أي نثبتها ولا نخوض في كيفيتها","الغزالي","ابن رشد"],answer:1},
        ]
    }
}
};

// ===================== GAME STATE =====================
const playerColors = ['#2ecc71','#3498db','#e67e22','#9b59b6'];
const diffLabels = {easy:"سهل",medium:"متوسط",hard:"صعب",expert:"خبير"};
const diffClasses = {easy:"diff-easy",medium:"diff-medium",hard:"diff-hard",expert:"diff-expert"};

let state = {
    mode: null, playerCount: 2, players: [], selectedCategories: [], baseTimeLimit: 25,
    currentPlayerIndex: 0, currentQuestionIndex: 0, currentLevel: 0,
    levelQuestions: [], levelCorrectCount: 0, levelQuestionsDone: 0,
    timer: null, timeLeft: 0, answered: false, gameOver: false,
    usedQuestions: new Set()
};

// ===================== INIT =====================
function init() {
    renderPlayerInputs();
    renderCategories();
    document.querySelectorAll('.count-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            state.playerCount = parseInt(btn.dataset.count);
            renderPlayerInputs();
        });
    });
}

function selectMode(mode) {
    state.mode = mode;
    document.getElementById('modeSolo').classList.toggle('selected', mode === 'solo');
    document.getElementById('modeMulti').classList.toggle('selected', mode === 'multi');
    document.getElementById('soloSection').style.display = mode === 'solo' ? 'block' : 'none';
    document.getElementById('multiplayerSection').style.display = mode === 'multi' ? 'block' : 'none';
    document.getElementById('settingsRow').style.display = 'flex';
    document.getElementById('btnStart').style.display = 'block';
}

function renderPlayerInputs() {
    const c = document.getElementById('playerInputs'); c.innerHTML = '';
    const labels = ['اللاعب الأول','اللاعب الثاني','اللاعب الثالث','اللاعب الرابع'];
    for (let i = 0; i < state.playerCount; i++) {
        const row = document.createElement('div'); row.className = 'player-input-row';
        row.innerHTML = `<div class="player-avatar">${i+1}</div><input type="text" placeholder="${labels[i]}" id="player${i}" maxlength="20">`;
        c.appendChild(row);
    }
}

function renderCategories() {
    const grid = document.getElementById('categoriesGrid'); grid.innerHTML = '';
    Object.entries(questionsDB).forEach(([key, cat]) => {
        const card = document.createElement('div'); card.className = 'category-card'; card.dataset.category = key;
        card.innerHTML = `<span class="category-icon">${cat.icon}</span><h3>${cat.name}</h3><p>${cat.description}</p>`;
        card.addEventListener('click', () => toggleCategory(card, key));
        grid.appendChild(card);
    });
}

function toggleCategory(card, key) {
    card.classList.toggle('selected');
    const idx = state.selectedCategories.indexOf(key);
    if (idx > -1) state.selectedCategories.splice(idx, 1); else state.selectedCategories.push(key);
    document.getElementById('btnPlay').disabled = state.selectedCategories.length === 0;
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function goToCategories() {
    state.players = [];
    if (state.mode === 'solo') {
        const name = document.getElementById('soloName').value.trim() || 'أنا';
        state.playerCount = 1;
        state.players.push({name, score:0, correct:0, wrong:0, levelReached:1});
    } else {
        for (let i = 0; i < state.playerCount; i++) {
            const input = document.getElementById(`player${i}`);
            state.players.push({name: input.value.trim() || `لاعب ${i+1}`, score:0, correct:0, wrong:0, levelReached:1});
        }
    }
    state.baseTimeLimit = parseInt(document.getElementById('timeLimit').value);
    showScreen('categoryScreen');
}

// ===================== LEVEL SYSTEM =====================
function startGame() {
    state.currentLevel = 0;
    state.currentPlayerIndex = 0;
    state.gameOver = false;
    state.usedQuestions = new Set();
    state.players.forEach(p => {p.score=0;p.correct=0;p.wrong=0;p.levelReached=1;});
    showLevelIntro();
}

function showLevelIntro() {
    const level = LEVELS[state.currentLevel];
    const starsHTML = Array.from({length:10},(_,i) => `<span class="diff-star ${i<level.stars?'':'empty'}">⭐</span>`).join('');
    const timeForLevel = getTimeForLevel();
    const timeText = timeForLevel > 0 ? `${timeForLevel} ثانية` : 'بدون وقت';
    document.getElementById('levelIntroContent').innerHTML = `
        <span class="level-number">المرحلة ${state.currentLevel+1}</span>
        <h2 class="level-title">${level.name}</h2>
        <div class="level-difficulty">${starsHTML}</div>
        <p class="level-desc">${level.desc}</p>
        <div class="level-info-chips">
            <div class="level-chip">📝 <span>${level.questionsCount}</span> أسئلة</div>
            <div class="level-chip">⏱ <span>${timeText}</span></div>
            <div class="level-chip">💎 <span>${level.pointsPerQ}</span> نقطة/سؤال</div>
            <div class="level-chip">✅ مطلوب <span>${level.minCorrectPercent}%</span> للتأهل</div>
        </div>
        <button class="btn-play" onclick="startLevel()" style="max-width:300px;margin:20px auto 0;display:block;">ابدأ المرحلة ▶</button>`;
    showScreen('levelIntroScreen');
}

function getTimeForLevel() {
    if (state.baseTimeLimit === 0) return 0;
    const reduction = Math.floor(state.currentLevel * 1.5);
    return Math.max(8, state.baseTimeLimit - reduction);
}

function getQuestionHash(q) {
    return q.q;
}

function startLevel() {
    const level = LEVELS[state.currentLevel];
    const diff = level.diff;
    let pool = [];

    state.selectedCategories.forEach(cat => {
        const qs = questionsDB[cat].questions[diff] || [];
        qs.forEach(q => {
            const hash = getQuestionHash(q);
            if (!state.usedQuestions.has(hash)) {
                pool.push({...q, category: questionsDB[cat].name, diff, _hash: hash});
            }
        });
    });

    shuffle(pool);
    state.levelQuestions = pool.slice(0, level.questionsCount);

    state.levelQuestions.forEach(q => state.usedQuestions.add(q._hash));

    if (state.levelQuestions.length === 0) { showResults(); return; }

    state.currentQuestionIndex = 0;
    state.levelCorrectCount = 0;
    state.levelQuestionsDone = 0;
    showScreen('gameScreen');
    renderScoresBar();
    showQuestion();
}

// ===================== GAME LOGIC =====================
function showQuestion() {
    state.answered = false;
    const q = state.levelQuestions[state.currentQuestionIndex];
    const player = state.players[state.currentPlayerIndex];
    const level = LEVELS[state.currentLevel];

    document.getElementById('currentPlayerDot').style.background = playerColors[state.currentPlayerIndex];
    document.getElementById('currentPlayerName').textContent = player.name;
    document.getElementById('questionCounter').textContent = `سؤال ${state.currentQuestionIndex+1} من ${state.levelQuestions.length}`;
    document.getElementById('levelBadge').textContent = `المرحلة ${state.currentLevel+1} — ${level.name}`;
    const pct = (state.currentQuestionIndex / state.levelQuestions.length) * 100;
    document.getElementById('levelProgressFill').style.width = pct + '%';
    document.getElementById('levelProgressText').textContent = `${state.currentQuestionIndex}/${state.levelQuestions.length}`;
    document.getElementById('progressBar').style.width = `${((state.currentLevel*10 + pct/10)/100)*100}%`;
    document.getElementById('questionCategory').textContent = q.category;
    const dt = document.getElementById('difficultyTag');
    dt.textContent = diffLabels[q.diff]; dt.className = 'difficulty-tag ' + diffClasses[q.diff];
    document.getElementById('questionText').textContent = q.q;
    document.getElementById('answerFeedback').innerHTML = '';

    const grid = document.getElementById('optionsGrid'); grid.innerHTML = '';
    const letters = ['أ','ب','ج','د'];
    q.options.forEach((opt, i) => {
        const btn = document.createElement('button'); btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-letter">${letters[i]}</span> ${opt}`;
        btn.addEventListener('click', () => selectAnswer(i));
        grid.appendChild(btn);
    });

    const timeForLevel = getTimeForLevel();
    if (timeForLevel > 0) {
        state.timeLeft = timeForLevel;
        document.getElementById('timerDisplay').style.display = 'flex';
        document.getElementById('timerValue').textContent = state.timeLeft;
        document.getElementById('timerDisplay').classList.remove('warning');
        clearInterval(state.timer);
        state.timer = setInterval(() => {
            state.timeLeft--;
            document.getElementById('timerValue').textContent = state.timeLeft;
            if (state.timeLeft <= 5 && state.timeLeft > 0) document.getElementById('timerDisplay').classList.add('warning');
            if (state.timeLeft <= 0) { clearInterval(state.timer); timeUp(); }
        }, 1000);
    } else { document.getElementById('timerDisplay').style.display = 'none'; }
}

function selectAnswer(index) {
    if (state.answered) return;
    state.answered = true; clearInterval(state.timer);
    const q = state.levelQuestions[state.currentQuestionIndex];
    const level = LEVELS[state.currentLevel];
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(b => b.classList.add('disabled'));
    buttons[q.answer].classList.add('correct');

    if (index === q.answer) {
        buttons[index].classList.add('correct');
        const bonus = getTimeForLevel() > 0 ? Math.ceil(state.timeLeft * (level.timeBonus || 1)) : 0;
        const points = level.pointsPerQ + bonus;
        state.players[state.currentPlayerIndex].score += points;
        state.players[state.currentPlayerIndex].correct++;
        state.levelCorrectCount++;
        document.getElementById('answerFeedback').innerHTML = `<span class="feedback-text correct">✅ إجابة صحيحة! +${points} نقطة</span>`;
    } else {
        buttons[index].classList.add('wrong');
        state.players[state.currentPlayerIndex].wrong++;
        document.getElementById('answerFeedback').innerHTML = `<span class="feedback-text wrong">❌ إجابة خاطئة</span><span class="feedback-detail">الإجابة الصحيحة: ${q.options[q.answer]}</span>`;
    }
    state.levelQuestionsDone++;
    renderScoresBar();
    setTimeout(nextQuestion, 2200);
}

function timeUp() {
    if (state.answered) return;
    state.answered = true;
    const q = state.levelQuestions[state.currentQuestionIndex];
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(b => b.classList.add('disabled'));
    buttons[q.answer].classList.add('correct');
    state.players[state.currentPlayerIndex].wrong++;
    state.levelQuestionsDone++;
    document.getElementById('answerFeedback').innerHTML = `<span class="feedback-text timeout">⏰ انتهى الوقت!</span><span class="feedback-detail">الإجابة الصحيحة: ${q.options[q.answer]}</span>`;
    renderScoresBar();
    setTimeout(nextQuestion, 2200);
}

function nextQuestion() {
    state.currentQuestionIndex++;
    if (state.currentQuestionIndex >= state.levelQuestions.length) { showLevelComplete(); return; }
    state.currentPlayerIndex = (state.currentPlayerIndex + 1) % state.players.length;
    showQuestion();
}

function renderScoresBar() {
    const bar = document.getElementById('scoresBar'); bar.innerHTML = '';
    state.players.forEach((p, i) => {
        const chip = document.createElement('div'); chip.className = 'score-chip';
        chip.innerHTML = `<div class="score-chip-dot" style="background:${playerColors[i]}"></div><span class="score-chip-name">${p.name}</span><span class="score-chip-points">${p.score}</span>`;
        bar.appendChild(chip);
    });
}

// ===================== LEVEL COMPLETE =====================
function showLevelComplete() {
    clearInterval(state.timer);
    const level = LEVELS[state.currentLevel];
    const total = state.levelQuestions.length;
    const correctPct = total > 0 ? Math.round((state.levelCorrectCount / total) * 100) : 0;
    const passed = correctPct >= level.minCorrectPercent;
    if (passed) state.players.forEach(p => p.levelReached = state.currentLevel + 2);
    const isLastLevel = state.currentLevel >= LEVELS.length - 1;

    let html = `<div class="level-complete-box">
        <span class="level-complete-icon">${passed ? (isLastLevel ? '👑' : '🎉') : '😔'}</span>
        <h3 class="level-complete-title">${passed ? (isLastLevel ? 'أكملت جميع المراحل!' : `اجتزت المرحلة ${state.currentLevel+1}!`) : `لم تجتز المرحلة ${state.currentLevel+1}`}</h3>
        <div class="level-complete-stats">
            الإجابات الصحيحة: <strong>${state.levelCorrectCount}</strong> من <strong>${total}</strong><br>
            النسبة: <strong>${correctPct}%</strong> — المطلوب: <strong>${level.minCorrectPercent}%</strong>
        </div>`;

    if (passed && !isLastLevel) html += `<button class="btn-next-level" onclick="goNextLevel()">المرحلة التالية ➡</button>`;
    else if (passed && isLastLevel) html += `<button class="btn-next-level" onclick="showResults()">النتائج النهائية 🏆</button>`;
    else html += `<button class="btn-next-level" onclick="retryLevel()">أعد المرحلة 🔄</button><br><button class="btn-retry-level" onclick="showResults()">إنهاء المسابقة</button>`;
    html += '</div>';

    const overlay = document.createElement('div');
    overlay.className = 'level-complete-overlay'; overlay.id = 'levelOverlay'; overlay.innerHTML = html;
    document.body.appendChild(overlay);
    if (passed) createConfetti();
}

function removeOverlay() { const o = document.getElementById('levelOverlay'); if (o) o.remove(); }

function goNextLevel() { removeOverlay(); state.currentLevel++; showLevelIntro(); }

function retryLevel() {
    removeOverlay();
    state.levelQuestions.forEach(q => state.usedQuestions.delete(q._hash));
    showLevelIntro();
}

// ===================== RESULTS =====================
function showResults() {
    removeOverlay(); clearInterval(state.timer);
    const sorted = [...state.players].sort((a,b) => b.score - a.score);
    const isSolo = state.mode === 'solo';
    const isTie = !isSolo && sorted.length > 1 && sorted[0].score === sorted[1].score;

    if (isSolo) {
        const p = sorted[0];
        const total = p.correct + p.wrong;
        const pct = total > 0 ? Math.round((p.correct/total)*100) : 0;
        const lvl = Math.min(p.levelReached, 10);
        document.getElementById('winnerName').textContent = `${p.name} — النتيجة: ${p.score} نقطة`;
    } else {
        document.getElementById('winnerName').textContent = isTie ? 'تعادل! 🤝' : `🎉 الفائز: ${sorted[0].name}`;
    }

    const table = document.getElementById('resultsTable'); table.innerHTML = '';
    sorted.forEach((p, i) => {
        const total = p.correct + p.wrong;
        const pct = total > 0 ? Math.round((p.correct/total)*100) : 0;
        const row = document.createElement('div');
        row.className = `results-row ${i===0?'first':''}`;
        row.innerHTML = `
            ${isSolo ? '<div class="rank-badge rank-1">⭐</div>' : `<div class="rank-badge rank-${i+1}">${['🥇','🥈','🥉','4'][i]||i+1}</div>`}
            <div class="results-player-info">
                <div class="results-player-name">${p.name}</div>
                <div class="results-player-stats">${p.correct} صحيحة · ${p.wrong} خاطئة · ${pct}%</div>
                <div class="results-level-reached">وصل إلى: المرحلة ${Math.min(p.levelReached,10)} — ${LEVELS[Math.min(p.levelReached,10)-1].name}</div>
            </div>
            <div class="results-score">${p.score}</div>`;
        table.appendChild(row);
    });
    showScreen('resultsScreen');
    createConfetti();
}

function createConfetti() {
    const colors = ['#2ecc71','#3498db','#e67e22','#9b59b6','#d4a843','#e74c3c','#1abc9c'];
    for (let i = 0; i < 60; i++) {
        const piece = document.createElement('div'); piece.className = 'confetti-piece';
        piece.style.left = Math.random()*100+'%';
        piece.style.background = colors[Math.floor(Math.random()*colors.length)];
        piece.style.width = (Math.random()*8+5)+'px'; piece.style.height = (Math.random()*8+5)+'px';
        piece.style.borderRadius = Math.random()>0.5?'50%':'2px';
        piece.style.animation = `confetti ${Math.random()*2+2}s linear ${Math.random()}s`;
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 4000);
    }
}

function restartSameSettings() { startGame(); }
function newGame() {
    state.selectedCategories = [];
    state.mode = null;
    document.querySelectorAll('.category-card').forEach(c => c.classList.remove('selected'));
    document.getElementById('btnPlay').disabled = true;
    document.getElementById('modeSolo').classList.remove('selected');
    document.getElementById('modeMulti').classList.remove('selected');
    document.getElementById('soloSection').style.display = 'none';
    document.getElementById('multiplayerSection').style.display = 'none';
    document.getElementById('settingsRow').style.display = 'none';
    document.getElementById('btnStart').style.display = 'none';
    showScreen('startScreen');
}

function shuffle(arr) {
    for (let i = arr.length-1; i > 0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

init();
</script>
